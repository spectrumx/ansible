---
- hosts: localhost
  tasks:

  - name: Get GPG key for kitware repo (for cmake)
    shell:  wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null


  - name: Add deadsnakes PPA
    apt_repository:
      repo: ppa:deadsnakes/ppa
      state: present

  - name: Add mozillateam PPA
    apt_repository:
      repo: ppa:mozillateam/ppa
      state: present

  - name: copy mozilla-firefox to /etc/apt/preferences.d
    copy:
      src: "files/apt-preferences-mozilla-firefox"
      dest: /etc/apt/preferences.d/mozilla-firefox
      mode: 0644
      owner: root
      group: root

  - name: Disable unattended upgrades for firefox
    lineinfile:
      path: /etc/apt/apt.conf.d/51unattended-upgrades-firefox
      state: present
      create: true
      regexp: '^Unattended-Upgrade'
      line: 'Unattended-Upgrade::Allowed-Origins:: "LP-PPA-mozillateam:${distro_codename}";'

  - name: Update apt cache
    apt:
      update_cache: yes

  - name: Install Dependencies (Apt)
    apt:
      pkg:
          - libhdf5-dev
          - mosquitto-clients
          - host
          - dnsutils
          - screen
          - telnet
          - chrony
          #- telegraf
          #- influxdb
          #- influxdb-client
          - vim
          - nano
          - less
          - file
          - telnet
          - iptables
          - python3-pip
          - cmake
          - xorg-dev
          - libboost-all-dev
          - minicom
          - net-tools
          - nmap
          - iftop
          - backport-iwlwifi-dkms
          - firefox
          - python3.13
          - python3.13-dev
          - python3.13-venv
          - jq
          # docker
          - nvidia-container
          - docker-buildx
          - docker-compose-v2
          - docker.io
          # tuner control
          - libusb-1.0-0
      state: present
      update_cache: yes

  - name: Gather Docker runtimes
    shell: docker info | grep -E "Runtimes:.*"
    register: docker_runtimes
    ignore_errors: yes

  - name: Restart Docker to load nvidia-container
    when: "'nvidia' not in docker_runtimes.stdout"
    shell:  service docker restart

  - name: Remove unnecessary packages
    apt:
      pkg:
        - gnome-initial-setup
        - nftables
      state: absent

  - name: Install Pixi to /usr/local/bin
    become: true
    become_user: mep
    ansible.builtin.shell: >
      curl -fsSL https://pixi.sh/install.sh | PIXI_BIN_DIR=/usr/local/bin PIXI_NO_PATH_UPDATE=1 sh
    args:
      creates: /usr/local/bin/pixi

  - name: Ensure /opt/pixi directory exists
    ansible.builtin.file:
      path: /opt/pixi
      state: directory
      owner: root
      group: root
      mode: '0755'

  - name: Copy pixi.toml to /opt/pixi/
    ansible.builtin.copy:
      src: pixi.toml
      dest: /opt/pixi/pixi.toml
      owner: root
      group: root
      mode: '0644'
    register: pixi_config

  - name: Install Pixi dependencies into default environment
    ansible.builtin.command:
      cmd: /usr/local/bin/pixi install
      chdir: /opt/pixi
    when: pixi_config.changed or not ansible_check_mode
    args:
      creates: /opt/pixi/.pixi/envs/default/bin/python

  - name: Create symlink to pixi python
    ansible.builtin.file:
      src: /opt/pixi/.pixi/envs/default/bin/python
      dest: /usr/local/bin/pixi-python
      state: link